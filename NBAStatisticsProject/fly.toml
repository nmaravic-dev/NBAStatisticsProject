# fly.toml app configuration file generated for nbastatsmaravic on 2026-07-22T14:31:09+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nbastatsmaravic'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  [[http_service.checks]]
    grace_period = "10s"
    interval = "60s"
    method = "GET"
    timeout = "5s"
    path = "/health/live"

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
